<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construtor de Palavras</title>
  <link rel="stylesheet" href="css/minigame1.css">
</head>
<body>
  <a href="abaminigame.html" class="home">
    <img src="imgs/minigame1/casa.png" alt="Voltar para minigames">
  </a>

  <main class="word-game">
    <section class="game-hero">
      <span class="eyebrow">Letramento visual</span>
      <h1>Construtor de Palavras</h1>
      <p>Observe a imagem, escute a dica visual e monte a palavra tocando nas letras. Depois leia uma frase de uso.</p>
    </section>

    <section class="word-board" aria-live="polite">
      <div class="topline">
        <span id="faseTitulo">Estrelas: <strong id="estrelas">0</strong>/5</span>
        <span id="nivelAtual">Nível inicial</span>
      </div>

      <div class="challenge">
        <img id="imagemObjeto" src="" alt="">
        <div class="challenge-copy">
          <h2 id="nomeDesafio">Monte a palavra</h2>
          <p id="pistaObjeto"></p>
          <p id="fraseObjeto" class="frase-modelo"></p>
        </div>
      </div>

      <div id="palavra" class="palavra" aria-label="Espaços da palavra"></div>
      <div id="areaLetras" class="letras" aria-label="Letras disponíveis"></div>

      <div class="actions">
        <button class="btn" type="button" onclick="mostrarDica()">Ver dica</button>
        <button class="btn btn-secondary" type="button" onclick="removerLetras()">Limpar</button>
      </div>

      <p id="mensagem" class="mensagem"></p>
    </section>
  </main>

  <audio id="somCorreto" src="imgs/minigame1/acerto.mp3"></audio>
  <script src="js/minigame1.js"></script>
</body>
</html>
